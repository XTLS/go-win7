name: Build patched Go master branch for tests

on:
  workflow_dispatch:
  schedule:
    - cron: '10 14 1,16 * *'
  push:
    branches:
      - build
    paths:
      - ".github/workflows/test-go_master.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - build
    paths:
      - ".github/workflows/test-go_master.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      matrix:
        goos: [windows]
        goarch: [amd64, 386]
        buildtarget: ['master']
      fail-fast: false
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
    steps:
      - name: Show workflow information
        shell: pwsh
        run: |
          $assetName = "$env:GOOS-$env:GOARCH"
          Write-Output "GOOS: $env:GOOS, GOARCH: $env:GOARCH, APPLY_BRANCH: ${{ matrix.buildtarget }}"
          "ASSET_NAME=$assetName" >> $env:GITHUB_ENV

      - name: Download source
        uses: actions/checkout@v7
        with:
          repository: 'golang/go'
          ref: ${{ matrix.buildtarget }}
          path: 'go'

      - name: Download patch
        uses: actions/checkout@v7
        with:
          path: 'patch'

      - name: Apply patch
        shell: pwsh
        run: |
          Push-Location .\go
          patch --verbose -p 1 -i "..\patch\patchmaster\go-master.diff"
          Pop-Location

      - name: Set-up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      - name: Build patched Go
        shell: pwsh
        run: |
          Push-Location .\go\src
          .\make.bat --no-banner
          Pop-Location

      - name: Copy binaries into bin
        if: matrix.goos != 'windows' || matrix.goarch != 'amd64'
        shell: pwsh
        run: |
          Push-Location .\go\bin
          $targetDirectory = "${env:GOOS}_${env:GOARCH}"
          if (Test-Path -LiteralPath $targetDirectory -PathType Container) {
              Get-ChildItem -Path 'go*' | Remove-Item -Recurse -Force
              Get-ChildItem -LiteralPath $targetDirectory -Force | Move-Item -Destination .\
              Remove-Item -LiteralPath $targetDirectory -Recurse -Force
              Remove-Item -LiteralPath ..\pkg\tool\windows_amd64 -Recurse -Force
          }
          Get-ChildItem -Force
          Pop-Location

      - name: Upload package to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: go-for-win7-master-${{ env.ASSET_NAME }}
          path: |
            ./go/*

  source:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download source
        uses: actions/checkout@v7
        with:
          repository: 'golang/go'
          ref: 'master'
          path: 'go'

      - name: Download patch
        uses: actions/checkout@v7
        with:
          path: 'patch'

      - name: Apply patch
        shell: pwsh
        run: |
          Push-Location .\go
          patch --verbose -p 1 -i "..\patch\patchmaster\go-master.diff"
          Pop-Location

      - name: Upload package to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: go-for-win7-master-source
          path: |
            ./go/*
