name: Build patched Go and release

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches:
      - build
    paths:
      - ".github/workflows/release.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/release.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
        buildtarget: ['go1.26.6']
      fail-fast: false
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
    steps:
      - name: Show workflow information
        run: |
          _NAME="$GOOS-$GOARCH"
          echo "GOOS: $GOOS, GOARCH: $GOARCH, GOVER: ${{ matrix.buildtarget }}"
          echo "ASSET_NAME=$_NAME" >> $GITHUB_ENV

      - name: Download source
        uses: actions/checkout@v7
        with:
          repository: 'golang/go'
          ref: ${{ matrix.buildtarget }}
          path: 'go'

      - name: Download patch
        uses: actions/checkout@v7
        with:
          path: 'patch'

      # Patches for Go 1.26.x before more minor changes introduces.
      - name: Apply patch
        run: |
          cd ./go
          patch --verbose -p 1 < ../patch/go-1-26.diff
          cd ..

      - name: Set-up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go/src/go.mod'
          check-latest: true

      - name: Build patched Go
        shell: bash
        run: |
          cd ./go/src
          . ./make.bash "$@" --no-banner
          ../bin/go tool dist banner
          cd ../..

      - name: Copy binaries into bin
        if: matrix.goos != 'linux' || matrix.goarch != 'amd64'
        shell: bash
        run: |
          cd ./go/bin
          DIR="${GOOS}_${GOARCH}"
          if [ -d "${DIR}" ]; then
            echo "Found ${DIR} copying binaries"
            rm ./go*
            for BINARY in "${DIR}"/*
            do
              echo "mv ./${BINARY} ./"
              mv ./${BINARY} ./
            done
            rm -r ./"${DIR}"
            rm -r ../pkg/tool/linux_amd64/
          fi
          cd ..
          ls -al ./bin
          cd ..

      - name: Copy License
        run: |
          cp -f ./patch/LICENSE ./go/

      - name: Upload package to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: go-for-win7-${{ env.ASSET_NAME }}
          path: |
            ./go/*

      - name: create ZIP archive
        if: github.event_name == 'release'
        shell: bash
        run: |
          cd ./go/
          zip -9vr ./go-for-win7-${{ env.ASSET_NAME }}.zip . -x "./.*" "./.*/*" "./**/.*" "./**/.*/*" "./**/*_test.go" "./**/testdata"
          cd ../

      - name: Compute hashes for file
        if: github.event_name == 'release'
        run: |
          cd ./go/
          FILE=./go-for-win7-${{ env.ASSET_NAME }}.zip
          DGST=$FILE.dgst
          for METHOD in {"md5","sha1","sha256","sha512"}
          do
            openssl dgst -$METHOD $FILE | sed 's/([^)]*)//g' >>$DGST
          done
          cd ../

      - name: Upload packages to release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'release'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./go/go-for-win7-${{ env.ASSET_NAME }}.zip*
          tag: ${{ github.ref }}
          file_glob: true

  legacy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        buildtarget: ['go1.26.6']
      fail-fast: false
    steps:
      - name: Download source
        uses: actions/checkout@v7
        with:
          repository: 'golang/go'
          ref: ${{ matrix.buildtarget }}
          path: 'go'

      - name: Download patch
        uses: actions/checkout@v7
        with:
          path: 'patch'

      - name: Apply patch
        run: |
          cd ./go
          patch --verbose -p 1 < ../patch/go-1-26.diff
          patch --verbose -p 1 < ../patch/legacy-1-26.diff
          cd ..

      - name: Copy License
        run: |
          cp -f ./patch/LICENSE ./go/

      - name: Upload package to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: source-legacy
          path: |
            ./go/*

      - name: create ZIP archive
        if: github.event_name == 'release'
        shell: bash
        run: |
          cd ./go/
          zip -9vr ./source-legacy.zip . -x "./.*" "./.*/*" "./**/.*" "./**/.*/*" "./**/*_test.go"
          cd ..

      - name: Compute hashes for file
        if: github.event_name == 'release'
        run: |
          cd ./go/
          FILE=./source-legacy.zip
          DGST=$FILE.dgst
          for METHOD in {"md5","sha1","sha256","sha512"}
          do
            openssl dgst -$METHOD $FILE | sed 's/([^)]*)//g' >>$DGST
          done
          cd ../

      - name: Upload packages to release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'release'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./go/source-legacy.zip*
          tag: ${{ github.ref }}
          file_glob: true
