name: Build patched Go and release

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches:
      - build
    paths:
      - ".github/workflows/release.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/release.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
        buildtarget: ['go1.27.1']
      fail-fast: false
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
    steps:
      - name: Show workflow information
        shell: pwsh
        run: |
          $assetName = "$env:GOOS-$env:GOARCH"
          Write-Output "GOOS: $env:GOOS, GOARCH: $env:GOARCH, GOVER: ${{ matrix.buildtarget }}"
          "ASSET_NAME=$assetName" >> $env:GITHUB_ENV

      - name: Download source
        uses: actions/checkout@v7
        with:
          repository: 'golang/go'
          ref: ${{ matrix.buildtarget }}
          path: 'go'

      - name: Download patch
        uses: actions/checkout@v7
        with:
          path: 'patch'

      # Patches for Go 1.27.x before more minor changes introduces.
      - name: Apply patch
        shell: pwsh
        run: |
          Push-Location .\go
          patch --verbose -p 1 -i "..\patch\go-1-27.diff"
          Pop-Location

      - name: Set-up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go/src/go.mod'
          check-latest: true

      - name: Build patched Go
        shell: pwsh
        run: |
          Push-Location .\go\src
          .\make.bat --no-banner
          Pop-Location

      - name: Copy binaries into bin
        if: matrix.goos != 'windows' || matrix.goarch != 'amd64'
        shell: pwsh
        run: |
          Push-Location .\go\bin
          $targetDirectory = "${env:GOOS}_${env:GOARCH}"
          if (Test-Path -LiteralPath $targetDirectory -PathType Container) {
              Get-ChildItem -Path 'go*' | Remove-Item -Recurse -Force
              Get-ChildItem -LiteralPath $targetDirectory -Force | Move-Item -Destination .\
              Remove-Item -LiteralPath $targetDirectory -Recurse -Force
              Remove-Item -LiteralPath ..\pkg\tool\windows_amd64 -Recurse -Force
          }
          Get-ChildItem -Force
          Pop-Location

      - name: Copy License
        shell: pwsh
        run: |
          Copy-Item -LiteralPath .\patch\LICENSE -Destination .\go -Force

      - name: Upload package to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: go-for-win7-${{ env.ASSET_NAME }}
          path: |
            ./go/*

      - name: create ZIP archive
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          Push-Location .\go
          7z a -tzip -mx=9 "-xr!.*" "-xr!*_test.go" "-xr!testdata" "${{ env.ASSET_NAME }}.zip" .
          Pop-Location

      - name: Compute hashes for file
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          Push-Location .\go
          $archivePath = .\${{ env.ASSET_NAME }}.zip
          $digestPath = "$archivePath.dgst"
          foreach ($algorithm in @('MD5', 'SHA1', 'SHA256', 'SHA512')) {
              $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm $algorithm).Hash
              Add-Content -LiteralPath $digestPath -Value "$algorithm = $hash"
          }
          Pop-Location

      - name: Upload packages to release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'release'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./go/go-for-win7-${{ env.ASSET_NAME }}.zip*
          tag: ${{ github.ref }}
          file_glob: true
